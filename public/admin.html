<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#121212" />
  <title>Jukebox 관리자</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="guest admin">
  <div class="page">
    <header class="topbar">
      <div class="brand"><span id="brandIcon" class="brand-icon"></span>Jukebox <span class="admin-tag">관리자</span></div>
      <div class="topbar-right">
        <span id="live" class="live" hidden>모니터 연결됨</span>
        <button id="logout" class="pill" hidden>로그아웃</button>
      </div>
    </header>

    <form id="login" class="login" hidden>
      <h1>관리자 로그인</h1>
      <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" required />
      <button class="primary" type="submit">들어가기</button>
      <div id="loginError" class="login-error" hidden></div>
    </form>

    <div id="panel" hidden>
      <div id="banner" class="banner" hidden></div>

      <section class="now-card">
        <img id="nowThumb" class="now-thumb" alt="" />
        <div class="now-meta">
          <div id="nowLabel" class="eyebrow">지금 재생</div>
          <div id="nowTitle" class="now-title">재생 중인 곡이 없어요</div>
          <div id="nowSub" class="hero-sub"></div>
          <div class="scrub">
            <div class="bar"><div id="nowBar"></div></div>
            <div class="time"><span id="nowT">0:00</span><span id="nowD"></span></div>
          </div>
        </div>
      </section>
      <div class="admin-controls">
        <button id="playPause" class="play small" aria-label="재생/일시정지"></button>
        <button id="skip" class="pill strong">바로 넘기기</button>
        <label class="vol"><span id="volIcon"></span><input id="volume" type="range" min="0" max="100" /><span id="volText" class="vol-text"></span></label>
      </div>

      <section class="panel">
        <div class="section-head">
          <h2>대기열 <span id="count" class="count"></span></h2>
          <button id="clear" class="pill danger">모두 비우기</button>
        </div>
        <ul id="queue" class="tracks"></ul>
      </section>
      <section class="panel">
        <form id="searchForm" class="search">
          <span id="searchIcon" class="search-icon"></span>
          <input id="q" type="search" placeholder="곡 검색 또는 유튜브 링크 — 맨 앞에도 넣을 수 있어요" autocomplete="off" enterkeyhint="search" />
        </form>
        <ul id="results" class="tracks"></ul>
      </section>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="admin.js"></script>
</body>
</html>
