<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#121212" />
  <title>Jukebox</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="guest">
  <div id="backdrop" class="backdrop"></div>

  <div class="page">
    <header class="topbar">
      <div class="brand"><span id="brandIcon" class="brand-icon"></span>Jukebox</div>
      <span id="live" class="live">모니터 연결됨</span>
    </header>

    <div id="banner" class="banner" hidden></div>

    <section id="hero" class="hero">
      <div class="art-wrap"><img id="nowThumb" class="art" alt="" /></div>
      <div class="hero-meta">
        <div id="nowLabel" class="eyebrow">지금 재생</div>
        <h1 id="nowTitle" class="hero-title">대기열이 비어 있어요</h1>
        <div id="nowSub" class="hero-sub"></div>
      </div>

      <div class="scrub">
        <div class="bar"><div id="nowBar"></div></div>
        <div class="time"><span id="nowT">0:00</span><span id="nowD"></span></div>
      </div>

      <div class="transport">
        <div class="side"></div>
        <button id="playPause" class="play" aria-label="재생/일시정지"></button>
        <div class="side right">
          <button id="skip" class="skip" aria-label="스킵"><span id="skipIcon"></span><span id="skipCount" class="badge" hidden></span></button>
        </div>
      </div>

      <label class="vol"><span id="volIcon"></span><input id="volume" type="range" min="0" max="100" /></label>

      <div id="emojis" class="emojis" title="누르면 모니터와 모두의 화면에 떠올라요">
        <button data-e="🔥">🔥</button><button data-e="👏">👏</button><button data-e="😂">😂</button><button data-e="💃">💃</button><button data-e="❤️">❤️</button><button data-e="🙌">🙌</button>
      </div>

      <div id="lyrics" class="lyrics-card" hidden></div>
    </section>

    <section class="panel">
      <div class="section-head">
        <h2>다음 곡 <span id="count" class="count"></span></h2>
        <button id="clear" class="pill" hidden>모두 비우기</button>
      </div>
      <ul id="queue" class="tracks"></ul>
    </section>
    <section class="panel">
      <form id="searchForm" class="search">
        <span id="searchIcon" class="search-icon"></span>
        <input id="q" type="search" placeholder="어떤 노래를 듣고 싶으세요?" autocomplete="off" enterkeyhint="search" />
      </form>
      <ul id="results" class="tracks"></ul>
    </section>
  </div>

  <div id="mini" class="mini" hidden>
    <div class="mini-bar"><div id="miniBar"></div></div>
    <img id="miniArt" class="mini-art" alt="" />
    <div class="mini-meta"><div id="miniTitle" class="mini-title"></div><div id="miniSub" class="mini-sub"></div></div>
    <button id="miniPlay" class="mini-play" aria-label="재생/일시정지"></button>
  </div>

  <div id="emojiLayer" class="emoji-layer"></div>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
